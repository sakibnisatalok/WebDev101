
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bind</title>
</head>
<body>
	    <button>Just a button.CLick me.</button>
</body>
<script>
  class React {
    constructor(){
      this.library = "React";
      this.server = "https://localhost:300";

      document.querySelector('button').addEventListener('click',this.handleClick.bind(this)); // after using this.handleClick, only reference of handleClick() is passed but not the props and methods. TO pass them , we require bind(this) after .handleCLick(). it sends the props and methods as well.
    }
    handleClick(){
      console.log('button clicked');
      console.log(this.server);
    }
  }

  const app = new React();
</script>
</html> 


// bind() was highly used in react. now we have better methods wrapping bind() underneath.
