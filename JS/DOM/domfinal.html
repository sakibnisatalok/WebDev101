
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Section</title>
</head>
<body style="background-color: black; color: white;">
    <ul class="language">
        <li>C++</li>
        <li>Javascript</li>
        <li>Python</li>
        <li>HTML</li>
        <li>Zig</li>
        <li>Lua</li>
        <li>Go</li>
    </ul>
</body>
<script>
      
    function addlang(langName){
        const Li=document.createElement('li')
        Li.innerHTML=`${langName}`
        document.querySelector('.language').appendChild(Li)
    }
    
    addlang('Typescript')
    addlang('Rust')

    function addlangOptimized(langNameNew){
        const li=document.createElement('li')
        li.appendChild(document.createTextNode(langNameNew))
        document.querySelector('.language').appendChild(li)
    }
    
    addlangOptimized('Haskell')

    //edit

    const secondLang=document.querySelector("li:nth-child(2)")
    console.log(secondLang)
    //secondLang.innerHTML="COBOL"

    const newli=document.createElement('li')
    newli.textContent="Bash"
    secondLang.replaceWith(newli)

    const lastLang=document.querySelector("li:last-child")
    console.log(lastLang)
    lastLang.outerHTML="<li>Haskell is goneeee.</li>"


    //remove
    const firstLang=document.querySelector("li:first-child")
    console.log(firstLang)
    firstLang.remove()





</script>
</html>
